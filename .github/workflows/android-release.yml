name: Android release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Versions
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (informational)
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify artifact
        run: |
          ls -lh build/app/outputs/flutter-apk/
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E "lib/.*\.so" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-finder-radar-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      # A rolling, always-downloadable APK for the newest successful build of
      # any branch. Public repos: no login needed to download the asset.
      - name: Publish rolling "apk-latest" release
        if: always() && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bluetooth Finder Radar — latest APK
          prerelease: true
          make_latest: false
          body: |
            Automatically built from `${{ github.ref_name }}` at
            `${{ github.sha }}` by GitHub Actions.

            * artifact: `app-release.apk`
            * ABI: arm64-v8a
            * build command: `flutter build apk --release --target-platform android-arm64`
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK to versioned tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
