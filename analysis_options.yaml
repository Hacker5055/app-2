include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters

analyzer:
  errors:
    # The project intentionally uses Turkish-free ASCII identifiers and full names.
    todo: ignore
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
